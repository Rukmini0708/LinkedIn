<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Strength Checker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1a3a5c 0%, #185FA5 50%, #378ADD 100%); color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #fff; border-radius: 14px; border: 0.5px solid #ddd; padding: 2rem; max-width: 560px; width: 100%; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; color: #111; }
  .pw-label { font-size: 11px; font-weight: 500; color: #888; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 8px; }
  .pw-input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; }
  #pw { flex: 1; font-family: monospace; font-size: 16px; padding: 0 14px; height: 44px; border-radius: 8px; background: #f5f5f0; border: 0.5px solid #ccc; color: #111; outline: none; letter-spacing: .04em; }
  #pw:focus { box-shadow: 0 0 0 2px #378ADD44; border-color: #378ADD; }
  #toggle-vis { background: none; border: 0.5px solid #ddd; border-radius: 8px; width: 44px; height: 44px; cursor: pointer; color: #888; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  #toggle-vis:hover { background: #f5f5f0; }

  .meter-track { height: 6px; border-radius: 99px; background: #eee; overflow: hidden; margin-bottom: .5rem; }
  .meter-fill { height: 100%; border-radius: 99px; transition: width .35s cubic-bezier(.4,0,.2,1), background .35s; width: 0%; }

  .score-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.75rem; }
  .score-label { font-size: 18px; font-weight: 500; transition: color .3s; color: #aaa; }
  .score-sub { font-size: 13px; color: #888; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.75rem; }
  .stat-card { background: #f5f5f0; border-radius: 8px; padding: 12px 14px 10px; }
  .stat-name { font-size: 11px; font-weight: 500; color: #888; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
  .stat-val { font-size: 22px; font-weight: 500; color: #111; }
  .stat-note { font-size: 11px; margin-top: 2px; color: #888; }

  .checks { display: flex; flex-direction: column; gap: 7px; margin-bottom: 1.5rem; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; transition: color .25s; }
  .chk.pass { color: #3B6D11; }
  .chk.fail { color: #A32D2D; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #eee; border: 0.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; transition: background .25s, border-color .25s; }
  .chk.pass .dot { background: #EAF3DE; border-color: #639922; color: #3B6D11; }
  .chk.fail .dot { background: #FCEBEB; border-color: #E24B4A; color: #A32D2D; }

  .tip-box { background: #f0f6ff; border-left: 2px solid #378ADD; border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 13px; color: #185FA5; display: none; }
  .tip-box.show { display: block; }

  .entropy-row { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #aaa; margin-bottom: .75rem; }
  .entropy-bar-wrap { flex: 1; height: 3px; background: #eee; border-radius: 99px; overflow: hidden; }
  .entropy-bar { height: 100%; border-radius: 99px; background: #aaa; transition: width .35s; }
</style>
</head>
<body>
<div class="card">
  <h1>Password Strength Checker</h1>

  <div class="pw-label">Enter password</div>
  <div class="pw-input-row">
    <input id="pw" type="password" placeholder="Type your password…" autocomplete="off" spellcheck="false" />
    <button id="toggle-vis" aria-label="Toggle password visibility">👁</button>
  </div>

  <div class="meter-track"><div class="meter-fill" id="meter"></div></div>
  <div class="score-row">
    <span class="score-label" id="score-label">—</span>
    <span class="score-sub" id="score-sub"></span>
  </div>

  <div class="grid">
    <div class="stat-card">
      <div class="stat-name">Length</div>
      <div class="stat-val" id="s-len">0</div>
      <div class="stat-note" id="s-len-note"></div>
    </div>
    <div class="stat-card">
      <div class="stat-name">Symbols</div>
      <div class="stat-val" id="s-sym">0</div>
      <div class="stat-note" id="s-sym-note"></div>
    </div>
    <div class="stat-card">
      <div class="stat-name">Numbers</div>
      <div class="stat-val" id="s-num">0</div>
      <div class="stat-note" id="s-num-note"></div>
    </div>
    <div class="stat-card">
      <div class="stat-name">Unique chars</div>
      <div class="stat-val" id="s-uniq">0</div>
      <div class="stat-note" id="s-uniq-note"></div>
    </div>
  </div>

  <div class="checks">
    <div class="chk" id="c-len8"><div class="dot"></div>At least 8 characters</div>
    <div class="chk" id="c-len12"><div class="dot"></div>12+ characters (recommended)</div>
    <div class="chk" id="c-upper"><div class="dot"></div>Uppercase letter (A–Z)</div>
    <div class="chk" id="c-lower"><div class="dot"></div>Lowercase letter (a–z)</div>
    <div class="chk" id="c-digit"><div class="dot"></div>Contains a digit (0–9)</div>
    <div class="chk" id="c-sym"><div class="dot"></div>Contains a symbol (!@#$…)</div>
    <div class="chk" id="c-nocommon"><div class="dot"></div>Not a common password</div>
    <div class="chk" id="c-norep"><div class="dot"></div>No long repeated sequences</div>
  </div>

  <div class="entropy-row">
    <span style="min-width:88px">Entropy</span>
    <div class="entropy-bar-wrap"><div class="entropy-bar" id="ebar" style="width:0%"></div></div>
    <span id="ebits" style="min-width:52px;text-align:right">— bits</span>
  </div>

  <div class="tip-box" id="tip"></div>
</div>

<script>
const COMMON = new Set(['password','123456','123456789','qwerty','abc123','letmein','monkey','1234567','password1','12345678','111111','sunshine','iloveyou','princess','admin','welcome','master','dragon','passw0rd','qwerty123','password123','1q2w3e4r','superman','batman','shadow','michael','football','baseball','soccer','hockey','charlie','donald','computer','hello','freedom','starwars','trustno1','login','mustang','access','flower','696969','7777777','pass','testing','test','pass123','000000','121212','1234','12345','123123','1111','666666','654321','qwertyuiop','abc','zxcvbn','asdfgh']);

const pw = document.getElementById('pw');
const toggleVis = document.getElementById('toggle-vis');
const meter = document.getElementById('meter');
const scoreLabel = document.getElementById('score-label');
const scoreSub = document.getElementById('score-sub');
const tip = document.getElementById('tip');

toggleVis.addEventListener('click', () => {
  const isText = pw.type === 'text';
  pw.type = isText ? 'password' : 'text';
  toggleVis.textContent = isText ? '👁' : '🙈';
});

function setCheck(id, pass) {
  const el = document.getElementById(id);
  el.className = 'chk ' + (pass ? 'pass' : 'fail');
  el.querySelector('.dot').textContent = pass ? '✓' : '✗';
}

function calcEntropy(pw) {
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;
  return pool > 0 ? Math.round(pw.length * Math.log2(pool)) : 0;
}

function hasLongRepeat(s) {
  return /(.)\1{3,}/.test(s) || /(?:012|123|234|345|456|567|678|789|890|abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz){2}/i.test(s);
}

pw.addEventListener('input', () => {
  const v = pw.value;
  const len = v.length;
  const syms = (v.match(/[^a-zA-Z0-9]/g) || []).length;
  const nums = (v.match(/[0-9]/g) || []).length;
  const uniq = new Set(v).size;
  const hasUpper = /[A-Z]/.test(v);
  const hasLower = /[a-z]/.test(v);
  const hasDigit = /[0-9]/.test(v);
  const hasSym = syms > 0;
  const notCommon = !COMMON.has(v.toLowerCase());
  const noRep = !hasLongRepeat(v);
  const entropy = calcEntropy(v);

  document.getElementById('s-len').textContent = len;
  document.getElementById('s-len-note').textContent = len === 0 ? '' : len < 8 ? 'Too short' : len < 12 ? 'Acceptable' : 'Great';
  document.getElementById('s-sym').textContent = syms;
  document.getElementById('s-sym-note').textContent = syms === 0 ? 'None' : syms + ' symbol' + (syms > 1 ? 's' : '');
  document.getElementById('s-num').textContent = nums;
  document.getElementById('s-num-note').textContent = nums === 0 ? 'None' : nums + ' digit' + (nums > 1 ? 's' : '');
  document.getElementById('s-uniq').textContent = uniq;
  document.getElementById('s-uniq-note').textContent = len > 0 ? Math.round(uniq / len * 100) + '% unique' : '';

  setCheck('c-len8', len >= 8);
  setCheck('c-len12', len >= 12);
  setCheck('c-upper', hasUpper);
  setCheck('c-lower', hasLower);
  setCheck('c-digit', hasDigit);
  setCheck('c-sym', hasSym);
  setCheck('c-nocommon', len === 0 || notCommon);
  setCheck('c-norep', len === 0 || noRep);

  const ebarPct = Math.min(100, Math.round(entropy / 128 * 100));
  document.getElementById('ebar').style.width = ebarPct + '%';
  document.getElementById('ebits').textContent = entropy + ' bits';

  let score = 0;
  if (len >= 8) score++;
  if (len >= 12) score++;
  if (len >= 16) score++;
  if (hasUpper) score++;
  if (hasLower) score++;
  if (hasDigit) score++;
  if (hasSym) score += 2;
  if (notCommon && len > 0) score++;
  if (noRep && len > 0) score++;
  if (uniq >= len * 0.7 && len > 0) score++;

  let strength, color, width, sub, tipText;
  if (len === 0) {
    strength = '—'; color = '#aaa'; width = '0%'; sub = ''; tipText = '';
  } else if (score <= 3 || !notCommon) {
    strength = 'Very weak'; color = '#E24B4A'; width = '15%'; sub = 'Easily cracked';
    tipText = !notCommon ? 'This is a very common password — avoid it entirely.' : 'Make it longer and add uppercase, digits, and symbols.';
  } else if (score <= 5) {
    strength = 'Weak'; color = '#EF9F27'; width = '35%'; sub = 'Vulnerable to attacks';
    tipText = 'Try adding more character types — symbols, numbers, or uppercase letters.';
  } else if (score <= 7) {
    strength = 'Fair'; color = '#BA7517'; width = '55%'; sub = 'Some protection';
    tipText = 'Good progress! Aim for 12+ characters and mix all character types.';
  } else if (score <= 9) {
    strength = 'Strong'; color = '#3B6D11'; width = '78%'; sub = 'Good resistance to attacks';
    tipText = 'Strong password. Consider going to 16+ characters for critical accounts.';
  } else {
    strength = 'Very strong'; color = '#1D9E75'; width = '100%'; sub = 'Excellent security';
    tipText = 'Excellent! This password is very hard to crack.';
  }

  meter.style.width = width;
  meter.style.background = color;
  scoreLabel.textContent = strength;
  scoreLabel.style.color = len === 0 ? '#aaa' : color;
  scoreSub.textContent = sub;
  tip.textContent = tipText;
  tip.className = 'tip-box' + (tipText ? ' show' : '');
});
</script>
</body>
</html>
